{% extends "base.html" %}

{% block title %}Novo Usuário{% endblock %}

{% block content %}

<div style="max-width: 600px; margin: 0 auto;">

    <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
        <a href="{{ url_for('lista_usuarios') }}" class="btn-icon" style="width: 40px; height: 40px; justify-content: center;">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 style="margin: 0; font-size: 1.8rem;">Cadastrar Usuário</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>Dados de Acesso</h3>
        </div>

        <form action="{{ url_for('cadastro_usuario') }}" method="POST">

            <div class="form-group">
                <label>Nome de Usuário (Login)</label>
                <div style="position: relative;">
                    <input type="text" name="username" required placeholder="Ex: joao.silva" autofocus>
                    <i class="fas fa-user" style="position: absolute; right: 15px; top: 15px; color: #666;"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Dados Adicionais (Nome Completo / Setor)</label>
                <input type="text" name="dados" required placeholder="Ex: João Silva - TI">
            </div>

            <div class="form-group">
                <label>Senha Inicial</label>
                <div style="position: relative;">
                    <input type="password" name="password" required placeholder="******">
                    <i class="fas fa-lock" style="position: absolute; right: 15px; top: 15px; color: #666;"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Tipo de Permissão</label>
                <select name="tipo_usuario" class="form-control" style="width: 100%; padding: 12px; background: var(--primary-color); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 8px;">
                    <option value="usuario_gerenciador">Usuário Comum (Abre chamados)</option>
                    <option value="manutencao">Equipe de Manutenção (Resolve chamados)</option>
                    <option value="admin">Administrador (Acesso Total)</option>
                </select>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Criar Usuário
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
