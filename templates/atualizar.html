{% extends "base.html" %}

{% block title %}Editar Produto{% endblock %}

{% block content %}

<div style="max-width: 600px; margin: 0 auto;">

    <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
        <a href="{{ url_for('listar_produtos') }}" class="btn-icon" style="width: 40px; height: 40px; justify-content: center;">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div>
            <h1 style="margin: 0; font-size: 1.8rem;">Editar Produto</h1>
            <p style="color: var(--text-muted); margin: 0;">{{ produto.nome }}</p>
        </div>
    </div>

    <div class="card">
        <form action="{{ url_for('atualizar_produto', produto_id=produto.id) }}" method="POST">

            <div class="form-group">
                <label>Código de Barras</label>
                <div style="position: relative;">
                    <input type="text" name="codigo_barras" value="{{ produto.codigo_barras }}" required>
                    <i class="fas fa-barcode" style="position: absolute; right: 15px; top: 15px; color: #666;"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" name="nome" value="{{ produto.nome }}" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Tipo de Item</label>
                    <select name="tipo_item" class="form-control" style="width: 100%; padding: 12px; background: var(--primary-color); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 8px;">
                        <option value="consumo" {% if produto.tipo_item == 'consumo' %}selected{% endif %}>Consumo</option>
                        <option value="permanente" {% if produto.tipo_item == 'permanente' %}selected{% endif %}>Permanente</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantidade Atual</label>
                    <input type="number" name="quantidade" value="{{ produto.quantidade }}" required min="0">
                </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <a href="{{ url_for('listar_produtos') }}" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancelar</a>
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-sync-alt"></i> Atualizar Dados
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
