{% extends "base.html" %}

{% block title %}Abrir Chamado{% endblock %}

{% block content %}

<div style="max-width: 800px; margin: 0 auto;">
    
    <div style="margin-bottom: 20px;">
        <h1>Nova Solicitação</h1>
        <p style="color: var(--text-muted);">Preencha os dados abaixo para abrir um chamado.</p>
    </div>

    <div class="card">
        <form action="{{ url_for('portal_solicitacoes') }}" method="POST" enctype="multipart/form-data">

            <div class="form-group">
                <label>Seu Nome Completo</label>
                <input type="text" name="nome_solicitante" required placeholder="Ex: Maria Souza" autofocus>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Título do Pedido</label>
                    <input type="text" name="titulo" required placeholder="Ex: Lâmpada Queimada">
                </div>

                <div class="form-group">
                    <label>Setor / Local</label>
                    <input type="text" name="setor" required placeholder="Ex: Financeiro">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Categoria</label>
                    <select name="categoria" class="form-control" style="width: 100%; padding: 12px; background: var(--primary-color); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 8px;">
                        <option value="Material de Escritorio">Material de Escritório</option>
                        <option value="Limpeza">Limpeza / Copa</option>
                        <option value="Manutencao Predial">Manutenção Predial</option>
                        <option value="Equipamentos">Equipamentos / TI</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nível de Urgência</label>
                    <select name="urgencia" class="form-control" style="width: 100%; padding: 12px; background: var(--primary-color); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 8px;">
                        <option value="baixa">Baixa</option>
                        <option value="media" selected>Média</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Descrição Detalhada</label>
                <textarea name="descricao" rows="5" required placeholder="Descreva o que você precisa..."></textarea>
            </div>

            <div class="form-group">
                <label>Anexar Foto (Opcional)</label>
                <div style="padding: 20px; border: 2px dashed var(--border-light); border-radius: 8px; text-align: center; background: rgba(255,255,255,0.02);">
                    <input type="file" name="anexos" multiple style="color: var(--text-muted);">
                </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 15px;">
                <a href="{{ url_for('lista_solicitacoes') }}" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancelar</a>
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-paper-plane"></i> Enviar Solicitação
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
