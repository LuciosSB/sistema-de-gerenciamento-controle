{% extends "base.html" %}

{% block title %}Novo Produto{% endblock %}

{% block content %}

<div style="max-width: 600px; margin: 0 auto;">

    <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 15px;">
        <a href="{{ url_for('listar_produtos') }}" class="btn-icon" style="width: 40px; height: 40px; justify-content: center;">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 style="margin: 0; font-size: 1.8rem;">Cadastrar Produto</h1>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>Dados do Item</h3>
        </div>

        <form action="{{ url_for('cadastro_produto') }}" method="POST">

            <div class="form-group">
                <label>Código de Barras / Patrimônio</label>
                <div style="position: relative;">
                    <input type="text" name="codigo_barras" required placeholder="Ex: 789..." autofocus>
                    <i class="fas fa-barcode" style="position: absolute; right: 15px; top: 15px; color: #666;"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Nome do Produto</label>
                <input type="text" name="nome" required placeholder="Ex: Cabo de Rede CAT6">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Tipo de Item</label>
                    <select name="tipo_item" class="form-control" style="width: 100%; padding: 12px; background: var(--primary-color); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 8px;">
                        <option value="consumo">Consumo (Gasto)</option>
                        <option value="permanente">Permanente (Ativo)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantidade Inicial</label>
                    <input type="number" name="quantidade" required min="0" value="0">
                </div>
            </div>

            <div style="margin-top: 10px;">
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Salvar Produto
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
